# Example Digital Ocean App Platform spec — NOT ready to paste blindly.
# Replace: repo, branch, region, instance size, and wire DATABASE_URL / REDIS_URL
# from Managed Databases (UI or DO reference syntax). Validate against:
# https://docs.digitalocean.com/products/app-platform/reference/app-specification/

name: my-service-app
region: nyc

# Uncomment if you define a dev DB in-spec (see DO docs for cluster references).
# databases:
#   - name: db
#     engine: PG
#     version: "16"
#     production: false

services:
  - name: api
    # GitHub — replace with your repo
    github:
      repo: your-github-org/my-service-app-production-ready
      branch: main
      deploy_on_push: true

    dockerfile_path: Dockerfile
    source_dir: /

    # Must match what the Node process listens on. DO often sets PORT=8080.
    http_port: 8080

    instance_count: 1
    instance_size_slug: basic-xxs

    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

      # Prefer encrypted secrets in the UI for these:
      # - DATABASE_URL   (Managed Postgres URI)
      # - REDIS_URL      (Managed Redis URI, often rediss://)
      # - APP_DATA_ENCRYPTION_KEY
      # - AUTH_CLIENT_SECRET
      # - APP_BASE_URL   e.g. https://my-service-app-xxxxx.ondigitalocean.app

      - key: APP_BASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_HTTPS_APP_URL

      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_POSTGRES_URL

      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_REDIS_URL

      - key: APP_DATA_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_LONG_RANDOM_SECRET

      # OIDC — copy from https://accounts.xpvishal.dev/.well-known/openid-configuration
      - key: AUTH_ISSUER
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_AUTHORIZATION_ENDPOINT
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_TOKEN_ENDPOINT
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_USERINFO_ENDPOINT
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_JWKS_URI
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_REVOKE_ENDPOINT
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      - key: AUTH_REDIRECT_URI
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_HTTPS_APP_URL/callback

      - key: AUTH_SCOPES
        scope: RUN_TIME
        value: "openid profile email"

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
